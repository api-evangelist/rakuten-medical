name: Rakuten Medical
image: https://rakuten-med.com/us/wp-content/uploads/sites/6/2021/02/RakutenMedical_KV.png
description: 'Rakuten Medical, Inc. is a global biotechnology company headquartered in San Diego, California,
  developing precision, cell-targeting investigational cancer therapies on its proprietary Alluminox
  platform — a drug-device combination pairing an IRDye 700DX light-activated dye conjugated to a
  cell-targeting antibody with local illumination by 690nm red light. Founded in 2010 as Aspyrian
  Therapeutics and renamed following investment from Rakuten Group, the company operates in the United
  States, Japan, Taiwan, Switzerland and India. Its lead asset ASP-1929, an EGFR-targeting antibody-dye
  conjugate, received marketing approval in Japan in 2021 as Akalux for unresectable locally advanced
  or recurrent head and neck cancer and is in global Phase 3 development alone and in combination with
  anti-PD-1 therapy; RM-1995 and RM-0256 follow in earlier-stage programs. As a clinical-stage
  therapeutics and drug-device company, Rakuten Medical publishes no public developer API, SDK, webhook,
  or machine-readable specification; this profile captures its corporate identity and public web
  properties in the API Evangelist network.'
